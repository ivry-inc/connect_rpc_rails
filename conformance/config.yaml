# Scopes the conformance suite to exactly what the library implements:
# the Connect protocol, unary only (over POST, and GET for side-effect-free RPCs),
# no compression/TLS/trailers.
features:
  versions:
    - HTTP_VERSION_1
  protocols:
    - PROTOCOL_CONNECT
  codecs:
    - CODEC_PROTO
    - CODEC_JSON
  compressions:
    - COMPRESSION_IDENTITY
  streamTypes:
    - STREAM_TYPE_UNARY
  supportsH2c: false
  supportsTls: false
  supportsTlsClientCerts: false
  supportsTrailers: false
  supportsHalfDuplexBidiOverHttp1: false
  supportsConnectGet: true
  supportsMessageReceiveLimit: false
